<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link rel="stylesheet" href="../public/css/main.css">
</head>

<body>
    <header><!--navigation bar-->
            <div class="topbar">
                <h1>Smart Event Planner</h1>
                <h2>Matthew's Dashboard</h2> <!-- TODO: Change to student's name -->
                <nav class = "nav-links">
                    <a href="student-dashboard.html" target="_self">Overview</a>
                    <a href="events.html"  target="_self">Events</a>
                    <a href="my-registrations.html" target="_self">My Registrations</a>
                    <a class="active-page" href="profile.html" target="_self">Profile</a>
                    
                    
                    <div class="user-menu">

                        <button id="menuButton" class="menu-button">
                            <span class="arrow">▲</span>
                            <script>rotateMenuArrow()</script>
                        </button>
                    
                        <div id="dropdown" class="dropdown hidden">
                            <a id="menu-items" href="index.html">Logout</a> <!-- Add more menu items here if needed -->
                        </div>

                    </div>
                    <script>toggleDropdown();</script>                
                </nav>
            </div>
        </header>
    <main class="profile-page">
        <section class="profile-card">
            <h1>My Profile</h1>
            <p class="profile-subtitle">View and update your account information.</p>

            <form class="profile-form">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input
                        type="text"
                        id="full-name"
                        name="fullName"
                        value="e.g. Student Name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="e.g. student@concordia.ca"
                    >
                </div>

                <div class="form-group">
                    <label for="student-id">Student ID</label>
                    <input
                        type="text"
                        id="student-id"
                        name="studentId"
                        value="e.g. 40123456"
                    >
                </div>

                <div class="form-group">
                    <label for="program">Program</label>
                    <input
                        type="text"
                        id="program"
                        name="program"
                        value="e.g. Software Engineering"
                    >
                </div>

                <div class="profile-actions">
                    <button type="submit">Save Changes</button>
                    
                </div>
            </form>
        </section>
    </main>
</body>
</html>
