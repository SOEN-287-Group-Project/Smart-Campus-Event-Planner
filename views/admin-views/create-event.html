<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/global_styles.css"/>
    <link rel="stylesheet" href="/css/Admin/styles2.css"/>
    <script src="/js/admin/admin.js" defer></script>
</head>

<body class="darkmode">
    <header><!--navigation bar-->
        <div class="topbar">
            <h1>Smart Event Planner</h1>
            <h2>Admin Dashboard</h2>
            <nav class = "nav-links">
                <a href="/admin/admin-dashboard" target="_self">Overview</a>
                <a href="/admin/manage-events"  target="_self">Manage Events</a>
                <a class="active-page" href="/admin/create-event" target="_self">Create Event</a>
                <a href="/admin/analytics" target="_self">Analytics</a>
                
                
                <div class="user-menu">
                    <button id="menuButton" class="menu-button">
                        <span class="arrow">▲</span>
                    </button>

                    <div id="dropdown" class="dropdown hidden">
                        <a href="/public/index">Logout</a> <!-- Add every link from the <nav> container into here, MAKE SURE IT IS BELOW THE LOGOUT AND NOT ABOVE-->
                    </div>
                    
                </div>
            </nav>
        </div>
    </header>


        <form id = "createEventForm" class ="panel">
            <label>
                Event Name
                <input id= "createEventName" class = "event-creation-input" type="text" placeholder="Enter event name" /><br>
            </label>
            
            <label>
                Description
                <input id= "createEventDescription" class = "event-creation-input" type="text" placeholder="Event description" /><br>
            </label>

            <label>
                Location
                <input id= "createEventLocation" class = "event-creation-input" type="text" placeholder="Event location" /><br>
            </label>

            <label>
                Organizer
                <input id= "createEventOrganizer" class = "event-creation-input" type="text" placeholder="Organizer" /><br>
            </label>

            <label>
                Organizer
                <select id= "createEventOrganizer" class = "event-category-dropdown">
                    <option></option>
                    <option></option>
                    <option></option>
                    <option></option>
                    <option></option>
                    <option></option>
                </select><br>
            </label>

            <label>
                Capacity
                <input id= "createEventCapacity" class = "event-creation-input" type="number" min="1" placeholder="Enter event capacity" /><br>
            </label>

            <label>
                Category
                <select id= "createEventCategory" class = "event-category-dropdown">
                    <option></option>
                    <option value="1">Academic</option>
                    <option value="3">Social</option>
                    <option value="4">Sports</option>
                    <option value="6">Cultural</option>
                    <option value="2">Career</option>
                    <option value="5">Workshop</option>
                    <option value="8">Club activities</option>
                    <option value="7">Volunteering</option>
                    <option value="10">Networking</option>
                    <option value="9">Guest lectures</option>
                    <option value="11">Other</option>
                </select><br>
            </label>

            <label>
                Start Date
                <input id= "createEventStartDate" class = "event-creation-input" type="date" /><br>
            </label>

            <label>
                Start Time
                <input id= "createEventStartTime" class = "event-creation-input" type="time" /><br>
            </label>

            <label>
                End Time
                <input id= "createEventEndTime" class = "event-creation-input" type="time" /><br>
            </label>

            <label>
                Status
                <select id= "createEventStatus" class = "event-category-dropdown">
                    <option value="open">Open</option>
                    <option value="full">Full</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="completed">Completed</option>
                    <option value="disabled">disabled</option>
                </select>
            </label>
            
            <button id= "createEventSubmit" type="submit" class="submit-event-button">Create Event</button>
            <button type="reset" class="reset-event-button">Reset</button>
        </form>


    <footer class="footer-generic">
        <p>&copy; 2026 Smart Campus Event Planner</p>
        <a href="/public/contact">Contact Us</a>
        <br>
        <a href="/public/about">About Us</a>
    </footer>        
</body>
