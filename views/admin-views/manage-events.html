<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/global_styles.css" />
    <script src="/controllers/adminController.js"></script>
</head>

<body>

    <header><!--navigation bar-->
        <div class="topbar">
            <h1>Smart Event Planner</h1>
            <h2>Admin Dashboard</h2>
            <nav class = "nav-links">
                <a href="/admin/admin-dashboard" target="_self">Overview</a>
                <a class="active-page" href="/admin/manage-events"  target="_self">Manage Events</a>
                <a href="/admin/create-event" target="_self">Create Event</a>
                <a href="/admin/analytics" target="_self">Analytics</a>
                
                
                <div class="user-menu">
                    <button id="menuButton" class="menu-button">
                        <span class="arrow">▲</span>
                        <script>rotateMenuArrow()</script>
                    </button>

                    <div id="dropdown" class="dropdown hidden">
                        <a href="/public/index" target="_self">Logout</a> <!-- Add more menu items here if needed -->
                        <a href="/admin/sdmin-dashboard" target="_self">Overview</a>
                        <a href="/admin/manage-events" target="_self">Manage Events</a>
                        <a href="/admin/create-event" target="_self">Create Event</a>
                        <a href="/admin/analytics" target="_self">Analytics</a>
                    </div>
                    
                </div>
                
                <script>toggleDropdown();</script>
            </nav>
        </div>
    </header>

    
    <h2 style="text-align: center;">Active Events</h2>
    
    <form>
        <input type="Search" class="search-event-admin" placeholder="Search events" />
    </form> 



    <section class="panel scroll-container">
        
        <table class="event-table">
            <thead>

                <tr>
                    <th>Event Name</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Category</th>
                    <th>Capacity</th>
                    <th style="text-align: center;">Action</th>
                </tr>

            </thead>

            <tbody id="eventTableBody"></tbody>

        </table>
    </section>

    <div id="editModal" class="modal"> <!--modal popup-->
        
        <div class="modal-content">
            
            <h2>Edit Event</h2>

            <div class="field">
                <label>Event Name</label>
                <input id="editName">
            </div>

            <div class="field">
                <label>Start Date & Time</label>
                <input id="editStart" type="datetime-local">
            </div>

            <div class="field">
                <label>End Date & Time</label>
                <input id="editEnd" type="datetime-local">
            </div>

            <div class="field">
                <label>Category</label>
                <select id="editCategory">
                    <option>Academic</option>
                    <option>Social</option>
                    <option>Sports</option>
                    <option>Cultural</option>
                    <option>Career</option>
                    <option>Workshop</option>
                    <option>Club activities</option>
                    <option>Volunteering</option>
                    <option>Networking</option>
                </select>
            </div>

            <div class="field">
                <label>Capacity</label>
                <input id="editCapacity" type="number" min="1">
            </div>

            <div class="button-group">
                <button id="saveBtn">Save</button>
                <button id="cancelBtn">Cancel</button>
            </div>    
        </div>

    </div>
    
    <script>renderEvents();</script> <!--table script-->

    <footer class="footer-generic">
        <p>&copy; 2026 Smart Campus Event Planner</p>
        <a href="/public/contact">Contact Us</a>
        <br>
        <a href="/public/about">About Us</a>
    </footer>    
</body>
