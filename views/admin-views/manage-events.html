<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/global_styles.css"/>
    <link rel="stylesheet" href="/css/Admin/styles2.css"/>
    <script src="/js/admin/admin.js" defer></script>
    <script src="/js/admin/manageEvents.js" defer></script>
    <script src="/js/darkmode.js" defer></script>
</head>

<body>

    <header><!--navigation bar-->
        <div class="topbar">
            <h1>Smart Event Planner</h1>
            <h2>Admin Dashboard</h2>
            <nav class = "nav-links">
                <a href="/admin/admin-dashboard" target="_self">Overview</a>
                <a class="active-page" href="/admin/manage-events"  target="_self">Manage Events</a>
                <a href="/admin/create-event" target="_self">Create Event</a>
                <a href="/admin/analytics" target="_self">Analytics</a>
                
                <div class="user-menu">
                    <button id="menuButton" class="menu-button">
                        <span class="arrow">▲</span>
                    </button>

                    <div id="dropdown" class="dropdown hidden">
                        <a href="/auth/logout">Logout</a>
                    </div>
                    
                </div>
            </nav>
        </div>
        <button id="theme-switch">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
        </button>
    </header>

    
    <h2 style="text-align: center;">Active Events</h2>
    
    <form>
        <input type="Search" class="search-event-admin" id = "event-search-function" placeholder="Search events" />
    </form> 

    <section class="panel scroll-container">
        
        <table class="event-table">
            <thead>

                <tr>
                    <th>Event Name</th>
                    <th>Organizer</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Category</th>
                    <th>Capacity</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th style="text-align: center;">Action</th>
                </tr>

            </thead>

            <tbody id="eventTableBody"></tbody>

        </table>
    </section>

    <div id="editStudentModal" class="modal"> <!--modal popup-->
        
        <div class="modal-content">
            
            <h2>Edit Event</h2>

            <div class="field">
                <label>Event Name</label>
                <input id="editName">
            </div>

            <div class="field">
                <label>Category</label>
                <select id="editCategory">
                    <option value="1">Academic</option>
                    <option value="3">Social</option>
                    <option value="4">Sports</option>
                    <option value="6">Cultural</option>
                    <option value="2">Career</option>
                    <option value="5">Workshop</option>
                    <option value="8">Club activities</option>
                    <option value="7">Volunteering</option>
                    <option value="10">Networking</option>
                    <option value="9">Guest lectures</option>
                    <option value="11">Other</option>
                </select>
            </div>

            <div class="field">
                <label>Capacity</label>
                <input id="editCapacity" type="number" min="1">
            </div>


            
            <div class="field">
                <label>Start Date</label>
                <input id="editStartDate" type="date">
            </div>
            


            <div class="field">
                <label>Start Time</label>
                <input id="editStartTime" type="time">
            </div>
             

            <div class="field">
                <label>End Time</label>
                <input id="editEndTime" type="time">
            </div>


            <div class="Description-field">
                <label>Location</label>
                <input id="editEventLocation" type="text">
            </div>    

            <div class="Description-field">
                <label>Description</label>
                <input id="editDescription" type="text">
            </div>

            <div class="field">
                <label>Status</label>
                <select id="editStatus">
                    <option value="open">Open</option>
                    <option value="full">Full</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="completed">Completed</option>
                    <option value="disabled">disabled</option>
                </select>
            </div>



            <div class="button-group">
                <button id="saveBtn">Save</button>
                <button id="cancelBtn">Cancel</button>
                <button id="deleteBtn">Delete</button>
            </div>    
        </div>

    </div>
    
    <div id="attendanceModal" class="modal">

        <div class="modal-content">

            <h2 id="currentEventTitle"></h2>

            <div class="attendance-field">
                

                <table class = "attendance-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="attendanceTableBody"></tbody>
                </table>
            </div>

            <div class="button-group">
                <button id="AttendanceSaveBtn">Save</button>
                <button id="AttendanceCancelBtn">Cancel</button>
            </div>

        </div>
    </div>   

    <footer class="footer-generic">
        <p>&copy; 2026 Smart Campus Event Planner</p>
        <a href="/public/contact">Contact Us</a>
        <br>
        <a href="/public/about">About Us</a>
    </footer>    
</body>
