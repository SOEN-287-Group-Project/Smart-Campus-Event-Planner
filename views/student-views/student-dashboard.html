<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Dashboard</title>
        <link rel="stylesheet" href="/css/main.css" />
        <link rel="stylesheet" href="/css/global_styles.css" />
        <link rel="stylesheet" href="/css/Public_Pages/student-dashboard.css" />
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <script src="/js/student/studentDashboard.js"></script>
        <script src="/js/admin/admin.js" defer></script>
        <script src="/js/darkmode.js" defer></script>
    </head>

    <body>
        <header><!--navigation bar-->
            <div class="topbar">
                <h1>Smart Event Planner</h1>
                <h2 id="student-name">Student Dashboard</h2>
                <nav class="nav-links">
                    <a class="active-page" href="/student/student-dashboard" target="_self">Overview</a>
                    <a href="/student/events" target="_self">Events</a>
                    <a href="/student/my-registrations" target="_self">My Registrations</a>
                    <a href="/student/profile" target="_self">Profile</a>
                    
                    <div class="user-menu">
                        <button id="menuButton" class="menu-button">
                            <span class="arrow">▲</span>
                        </button>
                    
                        <div id="studentDropdown" class="dropdown hidden">
                            <a id="menu-items" href="/auth/logout">Logout</a>
                        </div>
                    </div>
                </nav>
            </div>
            <button id="theme-switch">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/></svg>
        </button>
        </header>

        <section class="student-dashboard-overview-grid">
            <div class="panel overview-title">
                <h1>Overview</h1>

                <div class="stats-grid">
                    <div class="stat-card">
                        <span>Total Registrations</span>
                        <strong id="stat-total">0</strong>
                    </div>

                    <div class="stat-card">
                        <span>Upcoming Events</span>
                        <strong id="stat-upcoming">0</strong>
                    </div>

                    <div class="stat-card">
                        <span>Events Attended</span>
                        <strong id="stat-attended">0</strong>
                    </div>

                    <div class="stat-card">
                        <span>Cancelled Events</span>
                        <strong id="stat-cancelled">0</strong>
                    </div>
                </div>
            </div>

            <div class="panel overview-title">
                <h1>Your Upcoming Events</h1>

                <div class="stats-card">
                    <div class="upcoming-events-scroll">
                        <table class="upcoming-events-table">
                            <tbody id="upcoming-events-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <section class="panel">
                <div class="chart-card student-chart-card">
                    <canvas id="student-attendance-chart"></canvas>
                </div>
            </section>

            <div class="panel calendar">
                <div class="cal-header">
                    <button id="prevBtn">
                        <h2>‹</h2>
                    </button>
                    <div class="monthYear" id="monthYear"></div>
                    <button id="nextBtn">
                        <h2>›</h2>
                    </button>
                </div>
                <div class="days">
                    <div class="day">Mon</div>
                    <div class="day">Tue</div>
                    <div class="day">Wed</div>
                    <div class="day">Thu</div>
                    <div class="day">Fri</div>
                    <div class="day">Sat</div>
                    <div class="day">Sun</div>
                </div>
                <div class="dates" id="dates"></div>
            </div>
        </section>

        <footer class="footer-generic">
            <p>&copy; 2026 Smart Campus Event Planner</p>
            <a href="/public/contact">Contact Us</a>
            <br>
            <a href="/public/about">About Us</a>
        </footer>
    </body>
</html>
