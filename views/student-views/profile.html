<body>

        </button>
        </header>
    
    <main class="profile-page">

    <section class="profile-card">
        <h1>My Profile</h1>

        <p class="profile-subtitle">
            View and update your account information.
        </p>

        <form class="profile-form" id="profile-form">

            <div class="form-group">
                <label for="first-name">First Name</label>

                <input
                    type="text"
                    id="first-name"
                    name="firstName"
                    value="Student first name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="last-name">Last Name</label>

                <input
                    type="text"
                    id="last-name"
                    name="lastName"
                    value="Student last name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="student@gmail.com"
                    required
                >
            </div>

           
            <div class="form-group">
                  <label for="role">Current Role</label>

                   <input
                    type="text"
                    id="role"
                    name="role"
                    value=""
                    disabled
    >
</div>

            <div class="profile-actions">
                <button type="submit">
                    Update Profile
                </button>
            </div>

        </form>
    </section>

    <section class="profile-card password-card">
        <h2>Change Password</h2>

        <p class="profile-subtitle">
            Enter your current password and choose a new password.
        </p>

        <form class="profile-form" id="password-form">

            <div class="form-group">
                <label for="current-password">Current Password</label>

                <input
                    type="password"
                    id="current-password"
                    name="currentPassword"
                    required
                >
            </div>

            <div class="form-group">
                <label for="new-password">New Password</label>

                <input
                    type="password"
                    id="new-password"
                    name="newPassword"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm-password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirmPassword"
                    minlength="8"
                    required
                >
            </div>

            <div class="profile-actions">
                <button type="submit">
                    Update Password
                </button>
            </div>

        </form>
    </section>

</main>

    <footer class="footer-generic">

</body>
</html>
