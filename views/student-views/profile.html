<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="StyleSheet" href="/css/global_styles.css">
    <link rel="Stylesheet" href="/css/Student/profile.css">
    <script src="/js/admin/admin.js" defer></script>
</head>

<body class="darkmode">
    <header>
            <div class="topbar">
                <h1>Smart Event Planner</h1>
                <h2>Student Dashboard</h2> 
                <nav class = "nav-links">
                    <a href="/student/student-dashboard" target="_self">Overview</a>
                    <a href="/student/events"  target="_self">Events</a>
                    <a href="/student/my-registrations" target="_self">My Registrations</a>
                    <a class="active-page" href="/student/profile" target="_self">Profile</a>
                    
                    
                    <div class="user-menu">

                        <button id="menuButton" class="menu-button">
                            <span class="arrow">▲</span>
                        </button>
                    
                        <div id="studentDropdown" class="dropdown hidden">
                      
                           <a id="menu-items" href="/auth/logout">Logout</a>

                        </div>

                    </div>
                </nav>
            </div>
        </header>
    
    <main class="profile-page">

    <section class="profile-card">
        <h1>My Profile</h1>

        <p class="profile-subtitle">
            View and update your account information.
        </p>

        <form class="profile-form" id="profile-form">

            <div class="form-group">
                <label for="first-name">First Name</label>

                <input
                    type="text"
                    id="first-name"
                    name="firstName"
                    value="Student first name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="last-name">Last Name</label>

                <input
                    type="text"
                    id="last-name"
                    name="lastName"
                    value="Student last name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="student@gmail.com"
                    required
                >
            </div>

           
            <div class="form-group">
                  <label for="role">Current Role</label>

                   <input
                    type="text"
                    id="role"
                    name="role"
                    value=""
                    disabled
    >
</div>

            <div class="profile-actions">
                <button type="submit">
                    Update Profile
                </button>
            </div>

        </form>
    </section>

    <section class="profile-card password-card">
        <h2>Change Password</h2>

        <p class="profile-subtitle">
            Enter your current password and choose a new password.
        </p>

        <form class="profile-form" id="password-form">

            <div class="form-group">
                <label for="current-password">Current Password</label>

                <input
                    type="password"
                    id="current-password"
                    name="currentPassword"
                    required
                >
            </div>

            <div class="form-group">
                <label for="new-password">New Password</label>

                <input
                    type="password"
                    id="new-password"
                    name="newPassword"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm-password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirmPassword"
                    minlength="8"
                    required
                >
            </div>

            <div class="profile-actions">
                <button type="submit">
                    Update Password
                </button>
            </div>

        </form>
    </section>

</main>

    <footer class="footer-generic">
    <p>&copy; 2026 Smart Campus Event Planner</p>
    <a href="/public/contact">Contact Us</a>
    <br>
    <a href="/public/about">About Us</a>
    </footer> 
    <script src="/js/student/profile.js"></script>
</body>
</html>
