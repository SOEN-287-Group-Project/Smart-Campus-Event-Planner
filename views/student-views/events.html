        <header><!--navigation bar-->

                        <button id="menuButton" class="menu-button">

            <button id="theme-switch">

        </button>
        </header>

        <search class="search-bar-container">
            <form>
                <div>
                    <input id ="searchBar"class="search-bar" type="search" placeholder="Search"></input>
                </div>
            </form>
        </search>
        <p></p>
        <section class="event-card-container">
        </section>

        <div id="eventDetailsModal" class="event-details-page hidden">
         <section class="event-details-card">
            <div class="event-information">
                <p id="modalCategory" class="event-category">Student Activity</p>

                <h1 id="modalTitle">(event name)</h1>

                <p id="modalDescription" class="event-description">(event description)</p>

            <div class="event-facts">
                    <div class="event-fact">
                        <strong>Organiser</strong>
                        <span id="modalOrganiser"> Concordia </span>
                    </div>

            <div class="event-facts">
                <div class="event-fact">
                    <strong>Date</strong>
                    <span id="modalDate">(date)</span>
                </div>  

                <div class="event-fact">
                    <strong>Time</strong>
                    <span id="modalTime">(time)</span>
                </div>

                <div class="event-fact">
                    <strong>Location</strong>
                    <span id="modalLocation">(location)</span>
                </div>

                <div class="event-fact">
                    <strong>Available Spaces</strong>
                    <span id="modalCapacity">(spaces remaining)</span>
                </div>
            </div>

            <div class="event-actions">
                <button type="button" class="btn-register">Register for Event</button>
                <button type="button" id="closeModalBtn" class="btn-close">Close</button>
            </div>
        </div>
     </section>
    </div>
        
    <footer class="footer-generic">
        <p>&copy; 2026 Smart Campus Event Planner</p>
        <a href="/public/contact">Contact Us</a>

        <a href="/public/about">About Us</a>
    </footer>
