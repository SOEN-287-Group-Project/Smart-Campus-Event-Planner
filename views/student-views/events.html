<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="StyleSheet" href="/css/global_styles.css">
        <link rel="StyleSheet" href="/css/Student/events-details.css">
        <link rel="Stylesheet" href="/css/Student/events.css">
        <script src="/js/student/events.js" defer></script>
        <script src="/js/admin/admin.js" defer></script>
        
        <title>My Registrations</title>
    </head>
    <body>
        <header><!--navigation bar-->
            <div class="topbar">
                <h1>Smart Event Planner</h1>
                <h2>Student Dashboard</h2> <!-- TODO: Change to student's name -->
                <nav class = "nav-links">
                    <a href="/student/student-dashboard" target="_self">Overview</a>
                    <a class="active-page" href="/student/events"  target="_self">Events</a>
                    <a href="/student/my-registrations" target="_self">My Registrations</a>
                    <a href="/student/profile" target="_self">Profile</a>
                    
                    
                    <div class="user-menu">

                        <button id="menuButton" class="menu-button">
                            <span class="arrow">▲</span>
                        </button>
                    
                        <div id="studentDropdown" class="dropdown hidden">
                            <a id="menu-items" href="/public/index">Logout</a> <!-- Add more menu items here if needed -->

                        </div>

                    </div>
                </nav>
            </div>
        </header>

        <search class="search-bar-container">
            <form>
                <div>
                    <input id ="searchBar"class="search-bar" type="search" placeholder="Search"></input>
                </div>
            </form>
        </search>
        <p></p>
        <section class="event-card-container">
        </section>

        <div id="eventDetailsModal" class="event-details-page hidden">
         <section class="event-details-card">
            <div class="event-information">
                <p id="modalCategory" class="event-category">Student Activity</p>

                <h1 id="modalTitle">(event name)</h1>

                <p id="modalDescription" class="event-description">(event description)</p>

            <div class="event-facts">
                <div class="event-fact">
                    <strong>Date</strong>
                    <span id="modalDate">(date)</span>
                </div>  

                <div class="event-fact">
                    <strong>Time</strong>
                    <span id="modalTime">(time)</span>
                </div>

                <div class="event-fact">
                    <strong>Location</strong>
                    <span id="modalLocation">(location)</span>
                </div>

                <div class="event-fact">
                    <strong>Available Spaces</strong>
                    <span id="modalCapacity">(spaces remaining)</span>
                </div>
            </div>

            <div class="event-actions">
                <button type="button" class="btn-register">Register for Event</button>
                <button type="button" id="closeModalBtn" class="btn-close">Close</button>
            </div>
        </div>
     </section>
    </div>
        
    <footer class="footer-generic">
        <p>&copy; 2026 Smart Campus Event Planner</p>
        <a href="/public/contact">Contact Us</a>
        <br>
        <a href="/public/about">About Us</a>
    </footer> 
    </body>
</html>
